name: Routines

# The bridge from GitHub to the two routines (docs/cloud-loop.md, section 7).
# GitHub events did not reach the routines on 11 October 2026; GitHub Actions
# runs on every pull request, so this workflow fires the routines through their
# API triggers. The routines have no GitHub triggers of their own (removed by
# the owner on 11 October 2026: they ran a second reviewer for every event);
# their hourly schedules stay as a second net. Two review runs of one head can
# post conflicting verdicts (#140), so a fire call is retried only when the
# request never left (no name, no connection, failed TLS handshake). Each job only sends a POST; no
# code is checked out or run.
#
# The repository is public since 13 October 2026 (docs/decisions.md): a job
# fires only for a pull request whose head is a branch of this repository, never
# a fork's, and wake-builder only for a comment by the owner's account abbosc,
# the account every session and routine acts as.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main]
  issue_comment:
    types: [created]

# No job reads the repository. wake-builder reads the pull request, and review
# the comments of a draft on a push.
permissions: {}

jobs:
  # A new pull request, a push, a reopened one or one marked ready: the review
  # routine reviews it (or skips it, as .claude/skills/review-pr says).
  review:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == 'sodiqschoolapp/sodiq-platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One group per pull request, never cancelled: the POSTs go out in order.
    # The routine sessions they start still run side by side, so a push to a
    # draft that is being built fires nothing (the step below): on #140 the last
    # push of the build and the "ready for review" of the same head fired two
    # reviewer runs, which posted conflicting verdicts 9 seconds apart.
    concurrency:
      group: routines-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # Only to read the comments of a draft pull request on a push (the newest
    # [review]); nothing is written.
    permissions:
      issues: read
      pull-requests: read
    steps:
      # A push to a draft whose newest [review] by abbosc is "approved" is the
      # build of an approved plan: review-pr skips it, and the "ready for review"
      # of the finished work fires the review. A push to a draft with any other
      # newest verdict (a revised plan) still fires one.
      - name: Decide whether this event needs a review run
        id: need
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
          COMMENTS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
        run: |
          if [ "$ACTION" != "synchronize" ] || [ "$DRAFT" != "true" ]; then
            echo "fire=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          : > "$RUNNER_TEMP/comments.jsonl"
          page=1
          while :; do
            # A failed read fires the run: a review too many is harmless, a
            # revised plan left unreviewed stalls the task.
            if ! curl --fail-with-body --silent --show-error --max-time 30 \
              --retry 3 --retry-all-errors \
              --output "$RUNNER_TEMP/page.json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$COMMENTS_URL?per_page=100&page=$page"; then
              echo "The comments could not be read: the review run fires."
              echo "fire=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if ! count=$(jq 'length' "$RUNNER_TEMP/page.json") \
              || ! jq -c '.[]' "$RUNNER_TEMP/page.json" >> "$RUNNER_TEMP/comments.jsonl"; then
              echo "The comments could not be read: the review run fires."
              echo "fire=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done
          newest=$(jq -rs '[.[] | select(.user.login == "abbosc" and (.body | startswith("[review]")))] | last | (.body // "") | split("\n")[0] // ""' "$RUNNER_TEMP/comments.jsonl") || newest=""
          echo "Newest [review]: ${newest:-none}"
          case "$newest" in
            "[review] approved"*)
              echo "A push to a draft that is being built: no review run."
              echo "fire=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "fire=true" >> "$GITHUB_OUTPUT" ;;
          esac
      # Values go through env, never into the command text. The token is never
      # printed.
      - name: Fire the review routine
        if: steps.need.outputs.fire == 'true'
        env:
          ROUTINE_URL: ${{ secrets.REVIEW_ROUTINE_URL }}
          ROUTINE_TOKEN: ${{ secrets.REVIEW_ROUTINE_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$ROUTINE_URL" ] || [ -z "$ROUTINE_TOKEN" ]; then
            echo "::error::The secrets REVIEW_ROUTINE_URL and REVIEW_ROUTINE_TOKEN must both be set."
            exit 1
          fi
          text="Pull request #$NUMBER ($ACTION, head $HEAD_SHA)"
          echo "Payload: $text"
          body=$(jq -n --arg text "$text" '{text: $text}')
          # Retried only when the request never left (curl exit 6: no name,
          # 7: no connection, 35: TLS handshake failed); any other failure
          # turns the job red and the hourly run takes the pull request up.
          # A retry after a slow or failed answer could start a second session.
          for attempt in 1 2 3 4; do
            code=0
            status=$(curl --fail-with-body --silent --show-error --max-time 60 \
              --output "$RUNNER_TEMP/response.json" --write-out '%{http_code}' \
              --request POST "$ROUTINE_URL" \
              --header "Authorization: Bearer $ROUTINE_TOKEN" \
              --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
              --header "anthropic-version: 2023-06-01" \
              --header "Content-Type: application/json" \
              --data "$body") || code=$?
            case "$code" in
              6|7|35) echo "Attempt $attempt: no connection (curl exit $code)"; sleep 10 ;;
              *) break ;;
            esac
          done
          echo "HTTP status: $status"
          if [ "$code" -ne 0 ]; then
            echo "::error::The review routine was not fired (curl exit $code)."
            cat "$RUNNER_TEMP/response.json" 2>/dev/null || true
            exit 1
          fi
          echo "Session: $(jq -r '.claude_code_session_url // "(no session address in the answer)"' "$RUNNER_TEMP/response.json")"

  # A task pull request merged into main: the start routine starts the next task.
  start-after-merge:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == 'sodiqschoolapp/sodiq-platform'
      && startsWith(github.event.pull_request.head.ref, 'task/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fire the start routine
        env:
          ROUTINE_URL: ${{ secrets.START_ROUTINE_URL }}
          ROUTINE_TOKEN: ${{ secrets.START_ROUTINE_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$ROUTINE_URL" ] || [ -z "$ROUTINE_TOKEN" ]; then
            echo "::error::The secrets START_ROUTINE_URL and START_ROUTINE_TOKEN must both be set."
            exit 1
          fi
          text="Merged #$NUMBER"
          echo "Payload: $text"
          body=$(jq -n --arg text "$text" '{text: $text}')
          # Retried only when the request never left (curl exit 6: no name,
          # 7: no connection, 35: TLS handshake failed); any other failure
          # turns the job red and the hourly run takes the pull request up.
          # A retry after a slow or failed answer could start a second session.
          for attempt in 1 2 3 4; do
            code=0
            status=$(curl --fail-with-body --silent --show-error --max-time 60 \
              --output "$RUNNER_TEMP/response.json" --write-out '%{http_code}' \
              --request POST "$ROUTINE_URL" \
              --header "Authorization: Bearer $ROUTINE_TOKEN" \
              --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
              --header "anthropic-version: 2023-06-01" \
              --header "Content-Type: application/json" \
              --data "$body") || code=$?
            case "$code" in
              6|7|35) echo "Attempt $attempt: no connection (curl exit $code)"; sleep 10 ;;
              *) break ;;
            esac
          done
          echo "HTTP status: $status"
          if [ "$code" -ne 0 ]; then
            echo "::error::The start routine was not fired (curl exit $code)."
            cat "$RUNNER_TEMP/response.json" 2>/dev/null || true
            exit 1
          fi
          echo "Session: $(jq -r '.claude_code_session_url // "(no session address in the answer)"' "$RUNNER_TEMP/response.json")"

  # A [review] approved or changes needed by abbosc on a task pull request of
  # this repository: the builder should wake now. The start routine watches for "Acting on the review." for
  # ten minutes and resumes the task when it does not come (cloud-loop.md, §6).
  wake-builder:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && github.event.comment.user.login == 'abbosc'
      && (startsWith(github.event.comment.body, '[review] approved')
      || startsWith(github.event.comment.body, '[review] changes needed'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only to read the head branch and head repository of the pull request; the
    # comment event carries neither.
    permissions:
      pull-requests: read
    steps:
      - name: Read the head branch and head repository of the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_API_URL: ${{ github.api_url }}/repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/pull.json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$PR_API_URL"
          head_ref=$(jq -r '.head.ref' "$RUNNER_TEMP/pull.json")
          # A fork that was deleted leaves head.repo null.
          head_repo=$(jq -r '.head.repo.full_name // ""' "$RUNNER_TEMP/pull.json")
          echo "Head branch: $head_ref"
          echo "Head repository: $head_repo"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_repo=$head_repo" >> "$GITHUB_OUTPUT"
      - name: Fire the start routine
        if: >-
          steps.pr.outputs.head_repo == 'sodiqschoolapp/sodiq-platform'
          && startsWith(steps.pr.outputs.head_ref, 'task/')
        env:
          ROUTINE_URL: ${{ secrets.START_ROUTINE_URL }}
          ROUTINE_TOKEN: ${{ secrets.START_ROUTINE_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [ -z "$ROUTINE_URL" ] || [ -z "$ROUTINE_TOKEN" ]; then
            echo "::error::The secrets START_ROUTINE_URL and START_ROUTINE_TOKEN must both be set."
            exit 1
          fi
          first_line=$(printf '%s\n' "$COMMENT_BODY" | head -n 1 | tr -d '\r' | cut -c 1-200)
          text="Review on #$NUMBER: $first_line"
          echo "Payload: $text"
          body=$(jq -n --arg text "$text" '{text: $text}')
          # Retried only when the request never left (curl exit 6: no name,
          # 7: no connection, 35: TLS handshake failed); any other failure
          # turns the job red and the hourly run takes the pull request up.
          # A retry after a slow or failed answer could start a second session.
          for attempt in 1 2 3 4; do
            code=0
            status=$(curl --fail-with-body --silent --show-error --max-time 60 \
              --output "$RUNNER_TEMP/response.json" --write-out '%{http_code}' \
              --request POST "$ROUTINE_URL" \
              --header "Authorization: Bearer $ROUTINE_TOKEN" \
              --header "anthropic-beta: experimental-cc-routine-2026-04-01" \
              --header "anthropic-version: 2023-06-01" \
              --header "Content-Type: application/json" \
              --data "$body") || code=$?
            case "$code" in
              6|7|35) echo "Attempt $attempt: no connection (curl exit $code)"; sleep 10 ;;
              *) break ;;
            esac
          done
          echo "HTTP status: $status"
          if [ "$code" -ne 0 ]; then
            echo "::error::The start routine was not fired (curl exit $code)."
            cat "$RUNNER_TEMP/response.json" 2>/dev/null || true
            exit 1
          fi
          echo "Session: $(jq -r '.claude_code_session_url // "(no session address in the answer)"' "$RUNNER_TEMP/response.json")"
