name: Merge reviewed

# The merge of a reviewed task pull request (owner, 6 November 2026; docs/decisions.md,
# "6 November 2026: GitHub merges a reviewed task"; docs/cloud-loop.md, section 4). The review
# routine decides "[review] ready to merge at <sha>" and this workflow carries the merge out:
# the routine's own merge call was refused by its session's permission check on every task
# from 6 November 2026, and cloud sessions offer no mode without that check.
#
# What is merged is decided by apps/api/src/deploy/merge-reviewed.ts, read from GitHub on every
# attempt, as .claude/skills/review-pr step 10 says: a pull request of this repository, from a
# task/ branch, into main, whose newest [review] by abbosc at its head sha is "ready to merge",
# with no other verdict at that sha standing against it, and with checks and e2e green at that
# sha. Only that sha is merged; a later push is never merged. Anything else is left alone, or
# held with a comment to the owner and the label needs-owner.
#
# The repository is public: the job runs only for a comment by abbosc, the account every session
# and routine acts as. The code that runs is main's (an issue_comment run checks out the default
# branch, never the pull request's head), and no text of the comment reaches a shell: only its
# id and the pull request's number. The merge itself uses the owner's token MERGE_TOKEN, because
# a merge made with the workflow's own token starts no workflow (no CI on main, no test deploy,
# no next task through routines.yml).

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  merge:
    if: >-
      github.event.issue.pull_request
      && github.event.comment.user.login == 'abbosc'
      && startsWith(github.event.comment.body, '[review] ready to merge at ')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One run per pull request at a time; a second "ready to merge" waits for the first.
    concurrency:
      group: merge-reviewed-${{ github.event.issue.number }}
      cancel-in-progress: false
    # Reads the pull request, its comments and its checks; writes only the owner's notice and
    # the label needs-owner. The merge goes through MERGE_TOKEN.
    permissions:
      contents: read
      checks: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the merge command
        run: pnpm turbo run build --filter=@sodiq/api
      - name: Merge the reviewed pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_TOKEN: ${{ secrets.MERGE_TOKEN }}
          PULL_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: node apps/api/dist/deploy/cli.js merge-reviewed "$PULL_NUMBER" "$COMMENT_ID"
