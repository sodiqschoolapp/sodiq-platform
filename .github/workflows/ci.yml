name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request stops the older run. On main each commit has its
# own group, so no run is cancelled or replaced by a later merge.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # CI ONLY. The public values of .env.example: the users that db/setup/local.sql
  # creates in the PostgreSQL service of this job. Never a real server.
  DATABASE_URL: postgres://sodiq_app:sodiq_app_local@localhost:5432/sodiq_dev
  DATABASE_MIGRATION_URL: postgres://sodiq_migrator:sodiq_migrator_local@localhost:5432/sodiq_dev
  SECOND_STEP_KEY: c29kaXEtbG9jYWwtc2Vjb25kLXN0ZXAta2V5LTAwMDE=
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # The checks run as parallel jobs since 20 October 2026: as one job the tests
  # alone took 8 to 15 minutes and hit the 15-minute limit (#168). The job named
  # "checks" at the end is the one branch protection and the loop read; it is
  # green only when every part is green.
  lint-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history and origin/main: the next step compares this
          # pull request with the branch it goes into.
          fetch-depth: 0
      - name: Merged migrations are never edited
        # CLAUDE.md, Conventions: a migration is a new numbered file, never
        # edited after merge. A pull request may only add files under
        # db/migrations; a modified, deleted or renamed one fails here. On a
        # push to main the range is empty.
        run: |
          edited=$(git diff --name-status --diff-filter=a origin/main...HEAD -- db/migrations)
          if [ -n "$edited" ]; then
            echo "A merged migration was edited, deleted or renamed; add a new numbered file instead:"
            echo "$edited"
            exit 1
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit the production dependencies
        # A known advisory of level high or critical in a dependency the
        # application ships fails the job (decided by the owner, 11 October
        # 2026). A new dependency is a decision for the owner anyway.
        run: pnpm audit --prod --audit-level=high
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck

  tests:
    name: tests (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      # Every part runs to the end, so one red part names all its failures.
      fail-fast: false
      matrix:
        include:
          # The API's test files in three parts of the same size (Vitest
          # --shard); everything else (web and the packages) in a fourth.
          - part: api 1/3
            command: pnpm --filter @sodiq/api exec vitest run --shard=1/3
          - part: api 2/3
            command: pnpm --filter @sodiq/api exec vitest run --shard=2/3
          - part: api 3/3
            command: pnpm --filter @sodiq/api exec vitest run --shard=3/3
          - part: web and packages
            command: pnpm turbo run test --filter=!@sodiq/api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create the database users and sodiq_dev
        run: psql -h localhost -U postgres -f db/setup/local.sql
        env:
          # The superuser of the service container; only this step uses it.
          PGPASSWORD: postgres
      - name: Build the packages the tests import
        # What `turbo run test` builds first (its ^build): the API imports the
        # built dist of the shared packages.
        run: pnpm turbo run build --filter=@sodiq/api^...
      - name: Unit and API tests (${{ matrix.part }})
        run: ${{ matrix.command }}

  checks:
    needs: [lint-types, tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part of the checks passed
        env:
          LINT: ${{ needs.lint-types.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "lint-types: $LINT"
          echo "tests: $TESTS"
          if [ "$LINT" != "success" ] || [ "$TESTS" != "success" ]; then
            echo "::error::A part of the checks did not pass; its job above names the failure."
            exit 1
          fi

  # The browser tests run in three parts at the same time since 20 October 2026:
  # as one job they took 8 to 9 minutes against a 10-minute limit. Each part has
  # its own PostgreSQL, its own servers and its own database `sodiq_e2e`; the
  # spec files are divided between the parts. The job named "e2e" at the end is
  # the one branch protection, the deploy and the loop read.
  e2e-parts:
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create the database users and sodiq_dev
        run: psql -h localhost -U postgres -f db/setup/local.sql
        env:
          # The superuser of the service container; only this step uses it.
          PGPASSWORD: postgres
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Install Chromium
        run: pnpm --filter @sodiq/web exec playwright install --with-deps chromium
      - name: Browser tests
        # Shorter than the job's limit: a run that hangs fails here, and the next
        # step still keeps its traces.
        timeout-minutes: 10
        # `pnpm test:e2e` with this part's share of the spec files.
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3
      - name: Keep the Playwright traces of a failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    needs: [e2e-parts]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part of the browser tests passed
        env:
          PARTS: ${{ needs.e2e-parts.result }}
        run: |
          echo "e2e-parts: $PARTS"
          if [ "$PARTS" != "success" ]; then
            echo "::error::A part of the browser tests did not pass; its job above names the failure."
            exit 1
          fi

  # Task 0.10: a merge to main reaches the test environment without manual
  # steps (docs/deploy.md). Only after both jobs above passed on main; e2e must
  # keep running on every push to main, or a skipped e2e would skip this job.
  # The migrations run first, then Render deploys the API and the worker at
  # this commit, then the smoke test runs against the real address.
  deploy-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: test
      url: ${{ vars.TEST_URL }}
    # Never two deploys at once. GitHub keeps one waiting run per group: while
    # a deploy runs, a newer merge replaces an older waiting one, so the next
    # deploy takes the newest commit of main with every migration up to it.
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    env:
      # The workflow's env above holds the local CI values. This job talks to
      # the test database only: the migration address comes from the
      # environment's secret (the one place the migrator's password exists),
      # and the two local values are emptied so nothing can reach for them.
      DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
      DATABASE_URL: ''
      SECOND_STEP_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply the migrations to the test database
        # Before the new version starts. The runner holds a session lock, so
        # the address is Neon's direct one; it finds db/migrations in this checkout.
        run: pnpm db:migrate
      # Values go through env, never into the command text.
      - name: Deploy the API and the worker at this commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          COMMIT: ${{ github.sha }}
          API_SERVICE: ${{ vars.RENDER_API_SERVICE_ID }}
          WORKER_SERVICE: ${{ vars.RENDER_WORKER_SERVICE_ID }}
        run: node apps/api/dist/deploy/cli.js deploy --commit "$COMMIT" "$API_SERVICE" "$WORKER_SERVICE"
      - name: Smoke test
        env:
          TEST_URL: ${{ vars.TEST_URL }}
        run: node apps/api/dist/deploy/cli.js smoke "$TEST_URL"
