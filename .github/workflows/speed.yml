name: Speed

# Task 10.1 (`12`, Speed targets: "These targets are tested automatically
# before each release"; `14`, Speed tests): the speed run at three times the
# estimated yearly data, with invented data only, and the load of 1,000
# people. Approved in advance by the owner for task 10.1 on 28 October 2026
# (docs/build-plan.md, 10.1). Started by hand from the Actions tab, and every
# Sunday at 22:00 Tashkent (17:00 UTC), so the release checklist finds a
# recent run (docs/go-live/release-checklist.md). It reaches no server: the
# school is built in the PostgreSQL service of this job. The report is the
# run's artifact, also when the run fails.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * 0'

permissions:
  contents: read

concurrency:
  group: speed
  cancel-in-progress: false

env:
  # The public values of .env.example: the users that db/setup/local.sql
  # creates in the PostgreSQL service of this job. Never a real server.
  DATABASE_URL: postgres://sodiq_app:sodiq_app_local@localhost:5432/sodiq_dev
  DATABASE_MIGRATION_URL: postgres://sodiq_migrator:sodiq_migrator_local@localhost:5432/sodiq_dev
  SECOND_STEP_KEY: c29kaXEtbG9jYWwtc2Vjb25kLXN0ZXAta2V5LTAwMDE=
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  speed:
    runs-on: ubuntu-24.04
    # The run itself stops at 5 hours (speed.database.test.ts); the rest is set-up and the report.
    timeout-minutes: 340
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # The year's journals are about 15 GB; a large statement needs more
        # shared memory than Docker's 64 MB.
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Free the runner's disk for the data
        # Tools of the runner image this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create the database users and sodiq_dev
        run: psql -h localhost -U postgres -f db/setup/local.sql
        env:
          # The superuser of the service container; only this step uses it.
          PGPASSWORD: postgres
      - name: Build the packages the tests import
        run: pnpm turbo run build --filter=@sodiq/api^...
      - name: The speed run, three times the data, and the load
        run: pnpm --filter @sodiq/api exec vitest run src/modules/timetable/speed.database.test.ts
        env:
          SPEED_SIZE: triple
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speed-report
          path: apps/api/speed-report-triple.md
          if-no-files-found: warn
