# The test environment on Render (docs/spec/13-technology.md, Hosting and
# Running cost; task 0.10). The owner creates it once from this file
# (Dashboard, Blueprints, New Blueprint Instance) and enters the values
# marked `sync: false` when asked; they are never written here.
#
# Deploys are started by the deploy job of .github/workflows/ci.yml after the
# migrations, never by a push (autoDeployTrigger: off). docs/deploy.md
# describes the whole setup and what to do when a deploy fails. Production has
# its own Blueprint, render.production.yaml (task 10.4).
#
# pnpm: Render's build machine has a read-only global npm folder, so the
# pinned version cannot be installed with `npm install -g` (EROFS). Every
# command of a build runs it through npx instead (`npx -y pnpm@<version>`,
# the same version as `packageManager` in package.json;
# render-blueprint.test.ts keeps them equal). Node comes from .node-version.
services:
  - type: web
    name: sodiq-test-api
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 2
    buildCommand: npx -y pnpm@12.8.1 install --frozen-lockfile && npx -y pnpm@12.8.1 turbo run build --filter=@sodiq/api --filter=@sodiq/web
    startCommand: node --enable-source-maps apps/api/dist/main.js
    healthCheckPath: /api/health
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 30
    domains:
      - app-test.sodiqschool.uz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: '1'
      - key: WEB_FILES
        value: apps/web/dist
      - key: SENTRY_ENVIRONMENT
        value: test
      - key: VITE_SENTRY_ENVIRONMENT
        value: test
      # The address in the links of the mails (task 2.3c-2, decision 15 of
      # pull request #66): the public address of this test service, not a secret.
      - key: WEB_ORIGIN
        value: https://app-test.sodiqschool.uz
      # Entered in the dashboard at creation, the same values as the worker's.
      - key: DATABASE_URL
        sync: false
      - key: SECOND_STEP_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
      # The R2 bucket of the photos (task 2.2c-2, the owner's answer 2): entered
      # by the owner in the dashboard, never here. Unset: photos answer "not
      # configured yet" and everything else works.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false

  - type: worker
    name: sodiq-test-worker
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: npx -y pnpm@12.8.1 install --frozen-lockfile && npx -y pnpm@12.8.1 turbo run build --filter=@sodiq/api
    startCommand: node --enable-source-maps apps/api/dist/worker.js
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 30
    envVars:
      - key: SENTRY_ENVIRONMENT
        value: test
      # The worker writes the mails, so it needs the address of the links too (task 2.3c-2).
      - key: WEB_ORIGIN
        value: https://app-test.sodiqschool.uz
      - key: DATABASE_URL
        sync: false
      - key: SECOND_STEP_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
